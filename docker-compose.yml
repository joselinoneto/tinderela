# Runs the bot on the Raspberry Pi. Two ways to use it, both needing a .env
# beside it with UEX_API_TOKEN, ANTHROPIC_API_KEY and DISCORD_BOT_TOKEN:
#
#   on the Pi, from a clone of this repo:
#     docker compose up -d --build
#
#   from a dev machine (copies this file to the Pi):
#     ./scripts/deploy-pi.sh pi@raspberrypi.local
services:
  bot:
    image: sc-trade-intel-bot:latest
    # Only used when running from a clone of the repo on the Pi; the deploy
    # script copies this file on its own and loads a prebuilt image instead.
    build:
      context: .
      dockerfile: Dockerfile
    # the image is built locally or on the Pi — it is not on any registry
    pull_policy: never
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      SC_TRADE_DB: /data/bot-cache.db
    volumes:
      - bot-data:/data
    # keep headroom on the Pi 3's 1 GB of RAM
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  bot-data:
